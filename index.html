<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring RW 13 Sekeloa | AI Command Center</title>
    <link rel="icon" href="https://pptik.id/wp-content/uploads/2024/05/cropped-512x512-1-32x32.png" type="image/x-icon">
    <!-- Menggunakan Font Inter agar lebih modern & tech-look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Palette Warna Profesional (Slate & Royal Blue) */
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            
            /* Effects */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Header Modern Glassmorphism --- */
        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            height: 70px;
            transition: var(--transition);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        .brand img {
            height: 40px;
            width: auto;
        }

        .brand-text h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
        }

        .brand-text span {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- Buttons & Controls --- */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            outline: none;
            text-decoration: none;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: #cbd5e1;
            color: var(--text-muted);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:not(:disabled):hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-outline {
            background-color: white;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-outline:not(:disabled):hover {
            border-color: var(--primary);
            color: var(--primary);
            background-color: #eff6ff;
        }
        
        .btn-back {
            color: var(--text-muted);
            background: transparent;
            padding-left: 0;
        }
        
        .btn-back:hover {
            color: var(--primary);
            transform: translateX(-4px);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.75rem;
        }

        /* --- Form Inputs for Filters --- */
        .filter-container {
            background: white;
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
            box-shadow: var(--shadow-sm);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 140px;
        }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-control {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        /* --- Tab Switcher --- */
        .tab-group {
            display: inline-flex;
            background: #e2e8f0;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            padding: 6px 16px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* --- Main Layout --- */
        main {
            flex: 1;
            padding-top: 100px; /* Offset for fixed header */
            padding-bottom: 40px;
            padding-left: 20px;
            padding-right: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            position: relative;
        }

        /* Utility for Views */
        .view-section {
            display: none; /* Hidden by default */
            animation: fadeIn 0.4s ease-out;
            width: 100%;
        }

        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dashboard-header {
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 16px;
        }

        .dashboard-title h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .dashboard-title p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        /* --- Grid System --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 24px;
        }

        /* --- Camera Card Design --- */
        .cam-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: var(--transition);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .cam-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
            border-color: #cbd5e1;
        }

        /* Container gambar dengan rasio 16:9 */
        .cam-view {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #0f172a; /* Dark bg saat loading */
            overflow: hidden;
            cursor: pointer;
        }
        
        .cam-view:hover .cam-image {
            transform: scale(1.03);
        }

        .cam-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease, opacity 0.3s ease;
        }
        
        .cam-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #475569;
            z-index: 0;
        }

        .cam-placeholder i {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .cam-live-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(220, 38, 38, 0.9);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .cam-info {
            padding: 16px;
            background: white;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .cam-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .cam-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .cam-location {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .cam-actions {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .update-time {
            display: flex;
            align-items: center;
            gap: 5px;
            font-variant-numeric: tabular-nums; 
        }

        /* --- History Page Styles --- */
        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .history-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }

        .history-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .history-card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #f1f5f9;
        }

        .history-card-body {
            padding: 12px 16px;
        }

        .history-date-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            background: #eff6ff;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 6px;
        }

        .ai-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 6px;
            margin-right: 4px;
        }

        .detection-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }

        .tag {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            background: #f1f5f9;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .history-timestamp {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .history-ago {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        
        .loading-state {
            grid-column: 1 / -1;
            padding: 60px 20px;
            text-align: center;
            color: var(--text-muted);
            background: white;
            border-radius: var(--radius);
            border: 1px dashed var(--border);
        }
        
        /* Pagination */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        /* --- Skeleton Loading Animation --- */
        .skeleton {
            background: #e2e8f0;
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* --- Footer --- */
        footer {
            margin-top: auto;
            background: white;
            border-top: 1px solid var(--border);
            padding: 24px 0;
            text-align: center;
        }

        .footer-content p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* --- Fullscreen Loader --- */
        #initial-loader {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 0.5s ease;
        }
        
        .loader-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--primary);
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .filter-container {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>

    <!-- Initial Loading Screen -->
    <div id="initial-loader">
        <div class="loader-spinner"></div>
        <p style="color: var(--text-muted); font-weight: 500;">Menghubungkan ke CCTV...</p>
    </div>

    <header>
        <div class="header-container">
            <div class="brand" onclick="navigateToDashboard()">
                <!-- Fallback logo jika gambar tidak ada -->
                <img src="https://pptik.id/wp-content/uploads/2024/05/cropped-512x512-1-32x32.png" alt="Logo" onerror="this.style.display='none'">
                <div class="brand-text">
                    <h1>RW 13 Sekeloa</h1>
                    <span>Smart Monitoring System</span>
                </div>
            </div>
            <div>
                <button class="btn btn-primary" id="refresh-btn">
                    <i class="fas fa-sync-alt"></i> <span class="d-none d-md-inline">Refresh</span>
                </button>
            </div>
        </div>
    </header>

    <main>
        
        <!-- === VIEW: DASHBOARD === -->
        <div id="view-dashboard" class="view-section active">
            <div class="dashboard-header">
                <div class="dashboard-title">
                    <h2>Live Monitoring</h2>
                    <p>Pantau keamanan lingkungan secara real-time dari kamera CCTV aktif.</p>
                </div>
                <div class="status-badge">
                    <div class="pulse-dot"></div>
                    Sistem Online
                </div>
            </div>

            <div id="images-container" class="grid-container">
                <!-- Cards will be injected here via JS -->
                <!-- Skeleton Example (akan dihapus oleh JS) -->
                <div class="cam-card skeleton-card">
                    <div class="cam-view skeleton" style="height: 220px;"></div>
                    <div class="cam-info">
                        <div class="skeleton" style="height: 20px; width: 70%; margin-bottom: 10px;"></div>
                        <div class="skeleton" style="height: 15px; width: 40%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- === VIEW: HISTORY === -->
        <div id="view-history" class="view-section">
            <div style="margin-bottom: 20px;">
                <button class="btn btn-back" onclick="navigateToDashboard()">
                    <i class="fas fa-arrow-left"></i> Kembali ke Dashboard
                </button>
            </div>
            
            <div class="dashboard-title">
                <h2 id="history-title">Riwayat Kamera</h2>
                <p id="history-subtitle">Melihat rekaman masa lalu.</p>
            </div>

            <!-- Tab Switcher (CCTV vs AI) -->
            <div class="tab-group" style="margin-top: 16px;">
                <button class="tab-btn active" id="tab-cctv" onclick="switchHistoryTab('cctv')">
                    <i class="fas fa-video"></i> Rekaman CCTV
                </button>
                <button class="tab-btn" id="tab-ai" onclick="switchHistoryTab('ai')">
                    <i class="fas fa-robot"></i> Deteksi AI
                </button>
            </div>

            <!-- Filter Controls -->
            <div class="filter-container">
                <div class="form-group">
                    <label>Tanggal Mulai</label>
                    <input type="date" id="filter-start-date" class="form-control">
                </div>
                <div class="form-group">
                    <label>Jam Mulai</label>
                    <input type="time" id="filter-start-time" class="form-control">
                </div>
                <div class="form-group">
                    <label>Tanggal Selesai</label>
                    <input type="date" id="filter-end-date" class="form-control">
                </div>
                <div class="form-group">
                    <label>Jam Selesai</label>
                    <input type="time" id="filter-end-time" class="form-control">
                </div>
                <div class="form-group" style="flex: 0;">
                    <button class="btn btn-primary" onclick="applyHistoryFilter(true)" style="height: 38px;">
                        <i class="fas fa-filter"></i> Terapkan
                    </button>
                </div>
            </div>

            <div id="history-container" class="history-grid">
                <!-- History Items injected here -->
            </div>

            <!-- Pagination Controls -->
            <div id="pagination-controls" class="pagination-container" style="display: none;">
                <button class="btn btn-outline" id="prev-page-btn" onclick="changePage(-1)" disabled>
                    <i class="fas fa-chevron-left"></i> Sebelumnya
                </button>
                <span id="page-indicator" style="font-weight: 600; color: var(--text-muted); min-width: 100px; text-align: center;">Halaman 1</span>
                <button class="btn btn-outline" id="next-page-btn" onclick="changePage(1)" disabled>
                    Selanjutnya <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>

    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 RW 13 Sekeloa Bandung & PUSTEKHAN ITB. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const imageContainers = {};
        let ws = null;
        
        // DOM Elements
        const viewDashboard = document.getElementById('view-dashboard');
        const viewHistory = document.getElementById('view-history');
        const imagesContainer = document.getElementById('images-container');
        const historyContainer = document.getElementById('history-container');
        const initialLoader = document.getElementById('initial-loader');
        const refreshBtn = document.getElementById('refresh-btn');
        
        // Pagination Elements
        const paginationControls = document.getElementById('pagination-controls');
        const prevPageBtn = document.getElementById('prev-page-btn');
        const nextPageBtn = document.getElementById('next-page-btn');
        const pageIndicator = document.getElementById('page-indicator');

        // Filter Inputs
        const filterStartDate = document.getElementById('filter-start-date');
        const filterStartTime = document.getElementById('filter-start-time');
        const filterEndDate = document.getElementById('filter-end-date');
        const filterEndTime = document.getElementById('filter-end-time');

        // Tabs
        const tabCCTV = document.getElementById('tab-cctv');
        const tabAI = document.getElementById('tab-ai');
        
        // State
        let currentView = 'dashboard'; // 'dashboard' | 'history'
        let currentHistoryGuid = null;
        let currentHistoryName = '';
        let currentHistoryMode = 'cctv'; // 'cctv' | 'ai'
        let currentPage = 1;
        let hasMoreData = false;
        
        // Config AI
        const AI_COMPANY_GUID = 'COMPANY-0a3a303e-7dd0-4246-ad21-d675e77904b4-2024';
        const RAW_IMG_BASE_URL = 'https://smartparking.pptik.id/data/data/';

        // URL Default Placeholder
        const PLACEHOLDER_IMG = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22800%22%20height%3D%22600%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20800%20600%22%20preserveAspectRatio%3D%22none%22%3E%3Cdefs%3E%3Cstyle%20type%3D%22text%2Fcss%22%3E%23holder_18%20text%20%7B%20fill%3A%23AAAAAA%3Bfont-weight%3Abold%3Bfont-family%3AArial%2C%20Helvetica%2C%20Open%20Sans%2C%20sans-serif%2C%20monospace%3Bfont-size%3A40pt%20%7D%20%3C%2Fstyle%3E%3C%2Fdefs%3E%3Cg%20id%3D%22holder_18%22%3E%3Crect%20width%3D%22800%22%20height%3D%22600%22%20fill%3D%22%23EEEEEE%22%3E%3C%2Frect%3E%3Cg%3E%3Ctext%20x%3D%22270%22%20y%3D%22315%22%3ENo%20Signal%3C%2Ftext%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E';

        // --- NAVIGATION LOGIC ---

        function navigateToDashboard() {
            currentView = 'dashboard';
            currentHistoryGuid = null;
            
            viewHistory.classList.remove('active');
            setTimeout(() => {
                viewHistory.style.display = 'none';
                viewDashboard.style.display = 'block';
                void viewDashboard.offsetWidth; 
                viewDashboard.classList.add('active');
            }, 50);
            
            window.scrollTo(0,0);
        }

        function navigateToHistory(guid, name) {
            currentView = 'history';
            currentHistoryGuid = guid;
            currentHistoryName = name;

            // Set Title
            document.getElementById('history-title').textContent = `Riwayat: ${name}`;
            document.getElementById('history-subtitle').textContent = `ID Perangkat: ${guid}`;

            // Set Default Dates Filters
            setDefaultFilterDates();

            // Reset Tab to CCTV by default, Reset Page
            switchHistoryTab('cctv', false);
            currentPage = 1;
            updatePaginationUI();

            // Switch View
            viewDashboard.classList.remove('active');
            setTimeout(() => {
                viewDashboard.style.display = 'none';
                viewHistory.style.display = 'block';
                void viewHistory.offsetWidth; 
                viewHistory.classList.add('active');
            }, 50);

            // Fetch Initial Data
            applyHistoryFilter(true);

            window.scrollTo(0,0);
        }

        function handleRefresh() {
            if (currentView === 'dashboard') {
                initApp(); // Reload full app data
            } else if (currentView === 'history' && currentHistoryGuid) {
                applyHistoryFilter(false); // Refresh current view/page
            }
        }

        // --- HISTORY TAB LOGIC ---

        function switchHistoryTab(mode, autoFetch = true) {
            currentHistoryMode = mode;
            
            if (mode === 'cctv') {
                tabCCTV.classList.add('active');
                tabAI.classList.remove('active');
            } else {
                tabCCTV.classList.remove('active');
                tabAI.classList.add('active');
            }

            if (autoFetch) {
                applyHistoryFilter(true); // Reset to page 1 on tab switch
            }
        }

        // --- PAGINATION LOGIC ---

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage < 1) return;
            
            currentPage = newPage;
            updatePaginationUI();
            applyHistoryFilter(false); // Fetch w/o resetting page
        }

        function updatePaginationUI() {
            pageIndicator.textContent = `Halaman ${currentPage}`;
            prevPageBtn.disabled = currentPage <= 1;
            nextPageBtn.disabled = !hasMoreData;
        }

        // --- FILTER HELPERS ---

        function setDefaultFilterDates() {
            const now = new Date();
            const oneHourAgo = new Date(now.getTime() - (60 * 60 * 1000));

            // Helper YYYY-MM-DD
            const toDateStr = (date) => {
                return date.getFullYear() + '-' + 
                       String(date.getMonth() + 1).padStart(2, '0') + '-' + 
                       String(date.getDate()).padStart(2, '0');
            };

            // Helper HH:MM
            const toTimeStr = (date) => {
                return String(date.getHours()).padStart(2, '0') + ':' + 
                       String(date.getMinutes()).padStart(2, '0');
            };

            filterEndDate.value = toDateStr(now);
            filterEndTime.value = toTimeStr(now);
            
            filterStartDate.value = toDateStr(oneHourAgo); 
            filterStartTime.value = toTimeStr(oneHourAgo);
        }

        function getFilterValues() {
            return {
                startDate: filterStartDate.value,
                startTime: filterStartTime.value,
                endDate: filterEndDate.value,
                endTime: filterEndTime.value
            };
        }

        function applyHistoryFilter(resetPage = false) {
            const filters = getFilterValues();
            if (!filters.startDate || !filters.endDate) {
                alert("Mohon isi tanggal mulai dan selesai.");
                return;
            }

            if (resetPage) {
                currentPage = 1;
                updatePaginationUI();
            }
            
            renderHistoryLoading();
            paginationControls.style.display = 'none'; // Hide while loading
            
            const icon = refreshBtn.querySelector('i');
            if(icon) icon.classList.add('fa-spin');

            if (currentHistoryMode === 'cctv') {
                fetchLogFast(currentHistoryGuid, filters).finally(() => {
                    if(icon) setTimeout(() => icon.classList.remove('fa-spin'), 500);
                });
            } else {
                fetchAIReports(currentHistoryGuid, filters).finally(() => {
                    if(icon) setTimeout(() => icon.classList.remove('fa-spin'), 500);
                });
            }
        }

        // --- DATA FETCHING ---

        async function fetchDevices() {
            const icon = refreshBtn.querySelector('i');
            if(icon && currentView === 'dashboard') icon.classList.add('fa-spin');

            const url = 'https://api-iot-device.lskk.co.id/v1/devices/by-type-company?companyGuid=COMPANY-2b19d770-ac09-422e-b76f-9db22351b69d-2025&type=Camera';
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if(icon) setTimeout(() => icon.classList.remove('fa-spin'), 1000);
                
                if (data.success) return data.data;
                throw new Error('Gagal mengambil data perangkat');
            } catch (error) {
                console.error('Error:', error);
                if(icon) icon.classList.remove('fa-spin');
                return [];
            }
        }

        // 1. FETCH LOG FAST (CCTV RAW)
        async function fetchLogFast(guid, filters) {
            const limit = 20;
            const url = new URL('https://api-iot-log.lskk.co.id/v1/data/log-fast');
            url.searchParams.append('guid_device', guid);
            url.searchParams.append('limit', limit);
            url.searchParams.append('page', currentPage);
            url.searchParams.append('startDate', filters.startDate);
            url.searchParams.append('endDate', filters.endDate);
            url.searchParams.append('startTime', filters.startTime || '00:00');
            url.searchParams.append('endTime', filters.endTime || '23:59');

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.success && data.data && data.data.data && data.data.data.length > 0) {
                    renderHistoryList(data.data.data);
                    
                    // Logic Pagination for Log Fast
                    // If 'hasMore' provided in data.data or check if data length equals limit
                    if (data.data.hasMore !== undefined) {
                         hasMoreData = data.data.hasMore;
                    } else {
                        // Fallback logic
                        hasMoreData = data.data.data.length === limit;
                    }
                    
                    paginationControls.style.display = 'flex';
                    updatePaginationUI();
                } else {
                    hasMoreData = false;
                    showHistoryEmpty();
                }
            } catch (error) {
                console.error("Error fetching log fast:", error);
                showHistoryError();
            }
        }

        // 2. FETCH AI REPORTS
        async function fetchAIReports(guidDevice, filters) {
            const limit = 12;
            const url = new URL('https://api-iot-log.lskk.co.id/v1/reports/company');
            url.searchParams.append('companyGuid', AI_COMPANY_GUID);
            url.searchParams.append('type', 'AIProcessing-yolov8');
            url.searchParams.append('page', currentPage);
            url.searchParams.append('limit', limit);
            url.searchParams.append('guidDevice', guidDevice);

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.success && data.data && data.data.data && data.data.data.length > 0) {
                    renderAIHistoryList(data.data.data);
                    
                    // Logic Pagination for AI
                    // Response has totalPages
                    if (data.data.totalPages) {
                        hasMoreData = currentPage < data.data.totalPages;
                    } else {
                        hasMoreData = data.data.data.length === limit;
                    }

                    paginationControls.style.display = 'flex';
                    updatePaginationUI();
                } else {
                    hasMoreData = false;
                    showHistoryEmpty();
                }
            } catch (error) {
                console.error("Error fetching AI reports:", error);
                showHistoryError();
            }
        }

        // --- RENDERING ---

        function createCard(device) {
            const col = document.createElement('div');
            col.innerHTML = `
                <div class="cam-card" id="card-${device.deviceGuid}">
                    <div class="cam-view" onclick="navigateToHistory('${device.deviceGuid}', '${device.name}')">
                        <div class="cam-live-badge"><i class="fas fa-circle" style="font-size: 6px;"></i> LIVE</div>
                        <div class="cam-placeholder">
                            <i class="fas fa-video-slash"></i>
                            <span>Menunggu Data...</span>
                        </div>
                        <img class="cam-image" id="img-${device.deviceGuid}" 
                             src="${PLACEHOLDER_IMG}" 
                             alt="${device.name}"
                             style="opacity: 0;">
                    </div>
                    <div class="cam-info">
                        <div>
                            <div class="cam-header">
                                <h3 class="cam-title" title="${device.name}">${device.name}</h3>
                            </div>
                            <div class="cam-location">
                                <i class="fas fa-map-marker-alt" style="color: var(--primary);"></i>
                                <span>${Number(device.latitude).toFixed(5)}, ${Number(device.longitude).toFixed(5)}</span>
                            </div>
                        </div>
                        <div class="cam-actions">
                            <div class="update-time" style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px;">
                                <i class="far fa-clock"></i>
                                <span id="time-${device.deviceGuid}">Menunggu...</span>
                            </div>
                            <button class="btn btn-outline btn-sm" style="width: 100%; justify-content: center;" onclick="navigateToHistory('${device.deviceGuid}', '${device.name}')">
                                <i class="fas fa-history"></i> Lihat Riwayat
                            </button>
                        </div>
                    </div>
                </div>
            `;
            return col.firstElementChild;
        }

        function initializeCards(devices) {
            imagesContainer.innerHTML = '';
            
            if (devices.length === 0) {
                imagesContainer.innerHTML = '<div class="loading-state"><p>Tidak ada perangkat ditemukan.</p></div>';
                return;
            }

            devices.forEach(device => {
                const card = createCard(device);
                imagesContainer.appendChild(card);
                
                imageContainers[device.deviceGuid] = {
                    img: document.getElementById(`img-${device.deviceGuid}`),
                    time: document.getElementById(`time-${device.deviceGuid}`),
                    container: card
                };
            });
        }
        
        function renderHistoryLoading() {
            let skeletonHTML = '';
            for(let i=0; i<8; i++) {
                skeletonHTML += `
                <div class="history-card">
                    <div class="history-card-img skeleton"></div>
                    <div class="history-card-body">
                        <div class="skeleton" style="height: 16px; width: 40%; margin-bottom: 8px;"></div>
                        <div class="skeleton" style="height: 20px; width: 80%;"></div>
                        <div class="skeleton" style="height: 14px; width: 60%; margin-top: 4px;"></div>
                    </div>
                </div>`;
            }
            historyContainer.innerHTML = skeletonHTML;
        }

        // Render Raw CCTV Logs
        function renderHistoryList(historyData) {
            let html = '';
            
            historyData.forEach(item => {
                // Raw log uses filenames in 'value', needs base URL
                const imageUrl = `${RAW_IMG_BASE_URL}${item.value}`;
                const dateObj = item.datetime; // String format "DD-MM-YYYY HH:mm:ss" usually
                
                let dateDisplay = item.datetime;
                let timeAgoDisplay = '';
                
                try {
                    const parts = item.datetime.split(' ');
                    const dateParts = parts[0].split('-');
                    const timeParts = parts[1].split(':');
                    // YYYY, MM (0-index), DD, HH, mm, ss
                    const d = new Date(dateParts[2], dateParts[1]-1, dateParts[0], timeParts[0], timeParts[1], timeParts[2]);
                    timeAgoDisplay = timeAgo(d);
                } catch(e) {
                    timeAgoDisplay = item.datetime;
                }

                html += `
                    <div class="history-card" onclick="window.open('${imageUrl}', '_blank')">
                        <img src="${imageUrl}" class="history-card-img" loading="lazy" alt="History Image" onerror="this.src='${PLACEHOLDER_IMG}'">
                        <div class="history-card-body">
                            <div class="history-date-badge"><i class="far fa-calendar-alt"></i> CCTV Log</div>
                            <div class="history-timestamp">${dateDisplay}</div>
                            <div class="history-ago"><i class="far fa-clock"></i> ${timeAgoDisplay}</div>
                        </div>
                    </div>
                `;
            });
            
            historyContainer.innerHTML = html;
        }

        // Render AI Reports
        function renderAIHistoryList(aiData) {
            let html = '';

            aiData.forEach(item => {
                // AI Data has full imageUrl
                const imageUrl = item.imageUrl;
                // AI Data uses 'datetime' field: "28-11-2025 08:28:08"
                const dateDisplay = item.datetime;

                // Process Counts (e.g., vehicle: 1)
                let tagsHtml = '';
                if (item.counts) {
                    for (const [key, value] of Object.entries(item.counts)) {
                        if (value > 0) {
                            // Translate common keys
                            let label = key;
                            if(key === 'vehicle') label = 'Kendaraan';
                            if(key === 'person') label = 'Orang';
                            if(key === 'cat') label = 'Kucing';
                            
                            tagsHtml += `<span class="tag">${label}: ${value}</span>`;
                        }
                    }
                }
                if (!tagsHtml) tagsHtml = '<span class="tag">Tidak ada objek</span>';

                html += `
                    <div class="history-card" onclick="window.open('${imageUrl}', '_blank')">
                        <img src="${imageUrl}" class="history-card-img" loading="lazy" alt="AI Detection" onerror="this.src='${PLACEHOLDER_IMG}'">
                        <div class="history-card-body">
                            <div class="ai-badge"><i class="fas fa-brain"></i> AI YoloV8</div>
                            <div class="history-timestamp">${dateDisplay}</div>
                            <div class="detection-tags">
                                ${tagsHtml}
                            </div>
                        </div>
                    </div>
                `;
            });

            historyContainer.innerHTML = html;
        }

        function showHistoryEmpty() {
            historyContainer.innerHTML = `
                <div class="loading-state">
                    <i class="fas fa-box-open" style="font-size: 3rem; margin-bottom: 16px; color: #cbd5e1;"></i>
                    <p style="font-size: 1.1rem; font-weight: 500;">Tidak ada data ditemukan.</p>
                    <p style="font-size: 0.9rem;">Coba ubah filter tanggal atau jam.</p>
                </div>
            `;
            paginationControls.style.display = 'none';
        }

        function showHistoryError() {
            historyContainer.innerHTML = `
                <div class="loading-state">
                    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; margin-bottom: 16px; color: var(--danger);"></i>
                    <p style="font-size: 1.1rem; font-weight: 500;">Gagal memuat data.</p>
                    <button class="btn btn-primary btn-sm" style="margin-top: 10px;" onclick="applyHistoryFilter(true)">Coba Lagi</button>
                </div>
            `;
            paginationControls.style.display = 'none';
        }

        // --- HELPER TIME AGO ---
        function timeAgo(date) {
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + " thn lalu";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + " bln lalu";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + " hari lalu";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + " jam lalu";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + " mnt lalu";
            return Math.floor(seconds) + " dtk lalu";
        }

        // --- REALTIME UPDATES (WEBSOCKET) ---

        function updateCard(topic, imageUrl, timestamp) {
            const target = imageContainers[topic];
            if (!target) return;

            const tempImg = new Image();
            tempImg.onload = () => {
                target.img.src = tempImg.src;
                target.img.style.opacity = '1'; 
                target.time.textContent = `Live: ${timestamp}`;
                target.time.style.color = 'var(--success)';
                target.time.style.fontWeight = '600';
            };
            // Bypass cache
            tempImg.src = `${imageUrl}?t=${new Date().getTime()}`;
        }

        function connectWebSocket(devices) {
            if (ws) ws.close();
            
            ws = new WebSocket('wss://worker-cctv.pptik.id');
            
            ws.onopen = () => {
                console.log('Connected to WebSocket');
                devices.forEach(device => {
                    ws.send(JSON.stringify({ action: 'subscribe', topic: device.deviceGuid }));
                });
            };

            ws.onmessage = (event) => {
                try {
                    const payload = JSON.parse(event.data);
                    if(payload.guid_device && payload.value) {
                        updateCard(
                            payload.guid_device,
                            `${RAW_IMG_BASE_URL}${payload.value}`,
                            payload.datetime
                        );
                    }
                } catch (e) {
                    console.error('Parse error', e);
                }
            };

            ws.onclose = () => {
                setTimeout(() => connectWebSocket(devices), 3000);
            };
            
            ws.onerror = (error) => console.error('WebSocket Error:', error);
        }

        async function initApp() {
            try {
                const devices = await fetchDevices();
                initializeCards(devices);
                connectWebSocket(devices);
                
                setTimeout(() => {
                    initialLoader.style.opacity = '0';
                    setTimeout(() => {
                        initialLoader.style.display = 'none';
                    }, 500);
                }, 800);

            } catch (error) {
                console.error(error);
                initialLoader.innerHTML = `<p style="color:red">Gagal memuat sistem. Periksa koneksi internet.</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
        refreshBtn.addEventListener('click', handleRefresh);

    </script>
</body>
</html>
